# Espectral Brand (NeoForge companion) — build configuration.
#
# Standalone build on Gradle 8.x: NeoGradle 7 targets the 8.x line while the
# Fabric build (../branding-mod) runs on Gradle 9, so this module keeps its
# own wrapper. JDK 21 registered locally so the 1.21.1 toolchain resolves
# without downloads.
org.gradle.jvmargs=-Xmx3g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-21
org.gradle.java.installations.auto-download=false

# Parchment mappings for MC 1.21.1 (MDK pin — known good with NeoGradle 7.1.x).
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17

# Environment properties (mirrors the MDK layout; versions consumed below).
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Proven in this ecosystem (matches the repo's NeoForge fixtures/logs).
neo_version=21.1.242
loader_version_range=[1,)

## Mod properties
mod_id=espectral-brand
mod_name=Espectral Brand
mod_license=GPL-3.0-only
mod_group_id=es.spectral.brand

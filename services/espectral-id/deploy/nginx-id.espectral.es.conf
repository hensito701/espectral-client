# Identity service canonical host and legacy compatibility.
#
# Reverse proxy: id.uhce.top -> espectral-id (FastAPI :8091, loopback).
#
# TLS: this hostname is DNS-ONLY (not Cloudflare-proxied) because the zone is
# CF "Flexible" (edge HTTPS -> origin HTTP) and the zone API token lacks
# ruleset/pagerule/tunnel scope to enforce Full (strict) per-hostname. With
# DNS-only + an origin Let's Encrypt cert (certbot dns-cloudflare, renewal
# via /etc/letsencrypt/cf-dns-uhce.ini), bearer tokens are end-to-end encrypted
# client -> origin. Re-adding the CF proxy later REQUIRES first setting
# ssl=strict for this hostname (config rule) or migrating the zone to Full.
#
# Firewall note: INPUT CF_WEB chain drops non-Cloudflare sources on 80/443;
# a targeted "-A CF_WEB -p tcp --dport 443 -j ACCEPT" (persisted in
# /etc/iptables/rules.v4) opens 443 for direct TLS.
#
# IP trust: the global conf.d/palanctral_real_ip.conf only rewrites the peer
# address when the connection comes from a published Cloudflare range. On this
# DNS-only host CF is never the peer, so $remote_addr is always the true TCP
# peer and client-supplied CF-Connecting-IP/X-Forwarded-For are ignored; the
# app additionally only trusts CF-Connecting-IP when the peer is 127.0.0.1.
upstream espectral_id {
    server 127.0.0.1:8091;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name id.espectral.es id.uhce.top;

    # ACME webroot fallback (primary issuance is DNS-01).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name id.espectral.es;

    ssl_certificate     /etc/letsencrypt/live/id.espectral.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id.espectral.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://espectral_id;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name id.uhce.top;
    ssl_certificate /etc/letsencrypt/live/id.uhce.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id.uhce.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    location / {
        proxy_pass http://espectral_id;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

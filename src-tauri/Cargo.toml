[package]
name = "espectral-client"
version = "1.1.1"
description = "EspectralClient — lanzador open source para espectral.es"
authors = ["EspectralClient"]
edition = "2021"
rust-version = "1.77.2"

# Tauri v2 (v2.5.x stable line). Build = `cargo tauri build` from the repo root;
# the engine sidecar (node) is bundled as an external binary (see tauri.conf.json).
[lib]
name = "espectral_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

[features]
# The window loads the Vite dev server in dev (build.devUrl) and the bundled
# dist/index.html through Tauri's custom protocol in prod (build.frontendDist).
# Serving those embedded assets in release builds REQUIRES the
# `custom-protocol` feature, so it stays in `default` (tauri dev compiles
# without it and uses devUrl instead).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

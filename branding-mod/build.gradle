// Espectral Menu — thin root build. mc12111 (remap) and mc262 (non-remap) share ../src/main/java.

// Single source of truth: the mod version tracks the launcher release, so the
// minecraft:brand handshake (espectral:<loader>:<version>) is accurate per build.
ext.launcherVersion = new groovy.json.JsonSlurper().parse(file('../package.json')).version

subprojects {
    group = 'es.spectral'
    version = rootProject.ext.launcherVersion

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = rootProject.ext.releaseOf(project)
    }

    // Implementation-Version feeds EspectralBrand.modVersion()'s jar-manifest
    // fallback (used when the loader container lookup is unavailable).
    tasks.withType(Jar).configureEach {
        manifest {
            attributes(
                'Implementation-Title': 'espectral-menu',
                'Implementation-Version': project.version
            )
        }
    }

    // Deferred: the sourceSets/processResources extensions only exist once
    // the subproject's Loom/java plugin has applied — eager evaluation here
    // fails with "Could not find method sourceSets()" on Gradle 9.x.
    afterEvaluate {
        sourceSets {
            main {
                java.srcDirs = [rootProject.file('src/main/java'), 'src/main/java']
                resources.srcDirs = [rootProject.file('src/main/resources'), 'src/main/resources']
            }
        }

        processResources {
            inputs.property 'version', project.version
            filesMatching('fabric.mod.json') { expand 'version': project.version }
        }
    }
}

ext.releaseOf = { Project p -> p.name == 'mc262' ? 25 : 21 }

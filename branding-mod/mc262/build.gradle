plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

base { archivesName = 'espectral-menu-26.2' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    // Dev-runtime-only parity with production installs (src/engine/mods.mjs
    // pins the same release): fabric-api's resource-loader-v0 registers the
    // mod's asset pack (textures/lang) in runClient. Non-remap Loom has no
    // modImplementation; runtimeOnly keeps it off compile classpath and jar.
    runtimeOnly 'net.fabricmc.fabric-api:fabric-api:0.156.0+26.2'
}

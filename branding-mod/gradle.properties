# Espectral Menu — build configuration
#
# The 26.2 subproject needs javac >= 25 (class-file major 69) and Loom refuses
# to run below the MC version's required Java for remapped builds, so Gradle
# must run on a JDK 25+. Set JAVA_HOME to a JDK 25 before invoking the
# wrapper (e.g. the FastClient Temurin 25 install); the launcher repo also
# ships JDKs under data/runtimes/.
#
# JDK 21 is registered as an extra installation so the 1.21.11 subproject's
# toolchain resolves locally without auto-download.
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-21
org.gradle.java.installations.auto-download=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

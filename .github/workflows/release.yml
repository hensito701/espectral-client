name: Release

# Tag-gated only: branch pushes never trigger this workflow.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast with the secret's name in the most visible way possible:
      # without TAURI_SIGNING_PRIVATE_KEY `tauri build` dies late, after the
      # full compile, with "no private key" and no .sig updater artifacts.
      - name: Guard TAURI_SIGNING_PRIVATE_KEY present
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::Missing required secret TAURI_SIGNING_PRIVATE_KEY — add it under repo Settings > Secrets and variables > Actions, then re-push the tag."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Stable Rust toolchain (windows-msvc default)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -vV
          cargo -V

      - run: npm ci

      # Required pre-build on a fresh checkout: tauri.conf.json
      # `bundle.resources` points at build/tauri-resources/* (engine,
      # package.json, node_modules subset, node.exe, branding), which does not
      # exist until this script stages it. Same order as the local build
      # (scripts/build-windows-exe.sh): stage, then `tauri build`.
      # The script never runs npm install — deps come from `npm ci` above.
      - name: Stage Tauri resources
        run: node scripts/stage-tauri-resources.mjs

      - name: Build + draft GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Espectral Client ${{ github.ref_name }}'
          releaseDraft: true
      # A zipped copy of the installer, attached beside the bare .exe: some
      # browsers and middleboxes block or mangle unsigned .exe downloads while
      # a .zip passes through, and the versioned name can never be confused
      # with a stale setup.exe sitting in Downloads.
      - name: Zip installer + attach to draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*setup.exe | Select-Object -First 1
          $zip = "src-tauri/target/release/bundle/nsis/EspectralClient-${{ github.ref_name }}-x64-setup.zip"
          Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
          gh release upload "${{ github.ref_name }}" $zip --clobber


      # SLSA build provenance over the signed installer, its updater
      # signature, and the zipped copy — all under
      # src-tauri/target/release/bundle/nsis/.
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.zip

      # Document verification on the draft release. Download-host publish
      # stays manual (scripts/publish-release.mjs) — no publish steps here.
      - name: Write draft release verification notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" --draft --notes "## Espectral Client ${{ github.ref_name }} (draft)
          \
          \_\_Verify before publishing to the download host.\_\_
          \
          \### 1. SHA256 (Windows)
          \
          \`\`\`powershell
          certutil -hashfile <installer-from-draft-assets-below>.exe SHA256
          \`\`\`
          \
          Expected SHA256 (paste the hash of the draft asset you promote):
          \
          \`\`\`
          <EXPECTED_SHA256_FROM_DRAFT_ASSET>
          \`\`\`
          \
          \### 2. Build provenance (Sigstore, via GitHub attestation)
          \
          \`\`\`powershell
          gh attestation verify <installer-from-draft-assets-below>.exe --owner hensito701
          \`\`\`
          \
          \### 3. Updater signature
          \
          The matching \`.sig\` beside the installer is the Tauri updater signature
          for \`https://espectral.es/client/latest.json\`. Ship it with the promoted build."

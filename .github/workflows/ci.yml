name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      # Slint (winit + femtovg) and the X11/Wayland/GL stack it links against.
      - name: Install Slint / winit build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  audit:
    name: Rust dependency advisories (cargo audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      # Fails on any RustSec vulnerability in Cargo.lock; "unmaintained"
      # notices are reported as warnings only.
      - run: cargo audit

  windows-cross:
    name: Rust (Windows cross-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # gcc/binutils-mingw-w64 are not optional: the gnu target links with
      # mingw's linker, and the app embeds its Windows icon resource through
      # windres.
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - run: cargo check -p espectral-client --target x86_64-pc-windows-gnu

  windows-native:
    name: Rust (Windows, engine tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # The app crate is a Slint GUI binary and only makes sense on Linux here;
      # the engine is the half with platform-specific code worth testing.
      - run: cargo test -p espectral-engine

  js:
    name: JS (config/accounts + suite registry freshness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No `npm ci`: the repo has no third-party npm dependencies any more.
      # The JS that remains is the Suite-registry generator plus the three
      # modules scripts/import-lunar-account.mjs imports.
      - run: node --test tests/*.test.mjs

<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="EspectralClient — lanzador open source para espectral.es" />
    <title>EspectralClient</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <!-- Self-hosted fonts (no Google at runtime) -->
    <link rel="preload" href="/fonts/space-grotesk-400.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/space-grotesk-500.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/space-grotesk-600.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/space-grotesk-700.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <link rel="preload" href="/fonts/press-start-2p-400.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
    <script>
      // Theme FOUC guard — mirrors lib/theme.svelte.ts before first paint.
      (function () {
        try {
          var saved = localStorage.getItem('espectral_theme');
          var t = saved === 'dark' || saved === 'light' ? saved : null;
          if (t === null) {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          /* keep the dark default */
        }
      })();
    </script>
    <script>
      // Language FOUC guard — mirrors lib/i18n.svelte.ts before first paint.
      (function () {
        try {
          var saved = localStorage.getItem('espectral_lang');
          if (saved === 'es' || saved === 'en') {
            document.documentElement.lang = saved;
          }
        } catch (e) {
          /* keep the es default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

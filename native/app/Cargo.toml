[package]
name = "espectral-client"
description = "Espectral Client — native Minecraft launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
# Slint 1.18 needs a newer toolchain than the engine's MSRV.
rust-version = "1.92"
build = "build.rs"

[[bin]]
name = "espectral-client"
path = "src/main.rs"

[dependencies]
espectral-engine = { workspace = true }
espectral-skin3d = { workspace = true }
espectral-client-ui = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
# unstable-winit-030: OS file drag & drop (.mrpack) via WinitWindowAccessor (library-mods).
slint = { workspace = true, features = ["unstable-winit-030"] }
rfd = { workspace = true }
open = { workspace = true }
png = { workspace = true }
image = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }

[features]
# Dev only (see native/ui/Cargo.toml): with SLINT_LIVE_PREVIEW=1 at build
# time the binary loads app/ui/*.slint when it runs, so .slint edits need no
# rebuild. Never in release builds.
live-preview = ["espectral-client-ui/live-preview"]

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
